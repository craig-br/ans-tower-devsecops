---
- name: Push Build to GitHub
  hosts: all
  gather_facts: false
  tags:
    - github-release

  tasks:
  - name: Create a new release
    community.general.github_release:
      token: "{{ gh_password }}"
      user: "{{ gh_user }}"
      repo: juiceshop
      action: create_release
      tag: "{{ tag_name }}"
      target: master
      name: JuiceShop Demo
      body: "{{ tag_name}} release"
