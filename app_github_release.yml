---
- name: Push Build to GitHub
  hosts: all
  gather_facts: false
  tags:
    - github-release

  tasks:
  - debug:
      var: hostvars
      
  - name: Create a new release
    community.general.github_release:
      token: "{{ gh_password }}"
      user: "{{ gh_user }}"
      repo: juice-shop
      action: create_release
      tag: "{{ tag_name }}"
      target: master
      name: "JuiceShop Demo"
      body: "JuiceShop Demo"
    ignore_errors: true
    register: release
  
  - name: debug
    debug:
      var: release
