---
- name: Push Build to GitHub
  hosts: all
  gather_facts: false

  tasks:
    - name: Create new JuiceShop Release
      uri:
        url: "https://api.github.com/repos/{{ gh_user }}/juice-shop/releases"
        method: POST
        headers:
          Authorization: "token {{ gh_password }}"
        body_format: json
        body:
          '{"target_commitish": "{{ target_commitish | default("master") }}",  "name": "JuiceShop Demo {{ pkg_version }}", "draft": false, "prerelease": {{ prerelease | default(false) }}, "accept": "application/vnd.github.v3+json", "tag_name": "{{ tag_name }}"}'
        status_code: 201
      register: release_output
      until: release_output.json.errors is not defined
      retries: 60
      delay: 3
      tags:
        - create-release