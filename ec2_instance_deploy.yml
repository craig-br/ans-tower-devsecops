---
- name: Deploy EC2 Web Servers
  hosts: all
  gather_facts: false

  tasks:
  - name: Deploy Web Servers
    amazon.aws.ec2:
        key_name: "{{ ec2_vars.ec2_keyname }}"
        group: "{{ ec2_vars.ec2_sg_name }}"
        instance_type: "{{ ec2_vars.ec2_instance_type }}"
        image: "{{ ec2_vars.ec2_ami }}"
        wait: true
        region: "{{ ec2_vars.ec2_region }}"
        count_tag:
          Name: ec2_devsecops
        exact_count: "{{ ec2_vars.ec2_count }}"
        instance_tags:
          Name: ec2_devsecops
          function: "{{ ec2_vars.ec2_webserver_tag }}"
        wait_timeout: 500
    register: ec2

  - name: Wait for SSH to come up
    wait_for:
      host: "{{ item.public_ip }}"
      port: 22
      state: started 
    loop: "{{ ec2.instances }}"
